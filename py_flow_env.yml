name: py_flow_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python==3.9.16
  - pandas==1.5.3
  - numpy==1.24.3
  - matplotlib==3.7.1
  - seaborn==0.12.2
  - scipy==1.11.4
  - statsmodels==0.14.0
  - scikit-learn==1.3.2
  - prince
  - ipykernel
  - pip
  - pip:
      - prince==0.13.0

